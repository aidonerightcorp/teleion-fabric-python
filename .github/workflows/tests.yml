name: package-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python tools/sync_context.py --check
      - run: python -m unittest discover -s tests -v
      - run: python examples/compose_prose.py
      - name: Composition and restart contracts
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          CUDA_VISIBLE_DEVICES: ''
        run: python -I experiments/composition-recovery-v1/check_composition.py
